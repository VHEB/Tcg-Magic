<!DOCTYPE html>
<html lang="pr-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/CSS/Style.css"/> 
    <link rel="stylesheet" type="text/css" href="/CSS/reset.css">
	<link rel="stylesheet" type="text/css" href="/CSS/StyleSocial.css">
    <link rel="stylesheet" type="text/css" href="/CSS/fonts-icones.css">
    <title>Contato</title>
</head>
<body>
    <header>
        <img id="logo" src="/Img/LogoMagic.png" alt="Magic The Gathering Arena">
        <nav>
            <a class="NavM" href="/index.html">Home</a>
            <a class="NavM" href="/Pages/decks.html">Baralho</a>
            <a class="NavM" href="/Pages/historia.html">História</a>
            <a class="NavM" href="/Pages/contato.html">Contato</a>
        </nav>
    </header>
    <div id="container-contact">
        <form id="contactForm">
            <h2>Contato</h2>
            <input type="text" id="name" placeholder="Nome" required>
            
            <input type="email" id="email" placeholder="E-mail" required>
            
            <textarea id="message" rows="4" placeholder="Mensagem" required></textarea>
            
            <button class="option" type="submit">Enviar</button>
        </form>
    </div>

    <main class="main_content container">  
        <section class="section-seu-codigo container">
            <div class="content">
                <nav class="btn_social">
                    <ul>
                       <li><a href="https://github.com/VHEB" target="_blank" title="facebook"><i class="icon icon-github"></i></a></li>
                       <li><a href="https://www.instagram.com/vitor_heb/" target="_blank" title="instagram"><i class="icon icon-instagram"></i></a></li>
                       <li><a href="https://www.linkedin.com/in/vitor-heb/" target="_blank" title="linkdin"><i class="icon icon-linkedin"></i></a></li>
                    </ul>
                    <p class="description2">Todos os Direitos Reservados© <br>
                        Desenvolvido por Vitor Hugo Estefano Barbosa
                    </p>
                </nav>
            </div>
        </section>
    </main>
    <script>
        document.getElementById("contactForm").addEventListener("submit", function(event) {
            event.preventDefault();
            alert("Seu e-mail foi enviado com sucesso!");
            document.getElementById("contactForm").reset();
        });
    </script>
</body>
</html>
